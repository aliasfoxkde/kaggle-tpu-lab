name: kaggle-tpu-lab-ci
version: "1.0"
trigger_on:
  - push
  - tag
environment: {}
jobs:
  - name: lint
    image: ktl-ci-python:1
    steps:
      - name: Ruff check (whole repo, pyproject config)
        run: ruff check .
    timeout: 10m
  - name: types
    image: ktl-ci-python:1
    needs: [lint]
    steps:
      - name: mypy (relaxed baseline, pyproject config)
        run: mypy --config-file pyproject.toml glm53-flash/engine/glm53 glm53-flash/tools tools
    timeout: 15m
  - name: test
    image: ktl-ci-python:1
    needs: [types]
    steps:
      # Stream output (no redirect): the runner kills jobs that produce no log
      # output for ~1h, and the CPU suite is ~4.5h with long quiet stretches.
      # The step shell is dash (no PIPESTATUS), so run the pipeline under
      # bash explicitly to preserve pytest's exit code.
      - name: CPU test suite
        run: bash -c 'python3 -m pytest glm53-flash/engine/glm53/tests -q --no-header 2>&1 | tail -60; exit ${PIPESTATUS[0]}'
    timeout: 8h
